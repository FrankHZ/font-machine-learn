[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "font-machine-learn"
version = "0.1.0"
description = "Tools for extracting and learning tiny shaded bitmap fonts."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
